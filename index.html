<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EnergyMap</title>
  <meta name="description" content="EnergyMap plans your day around your energy: deep work in your peaks, routine work when you're steady, admin in your dips. Offline and private.">
  <meta name="theme-color" content="#0b0b0e">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint (no flash).
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('energymap.theme') || 'system'; } catch (e) {}
      var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <div class="app">
    <nav class="rail" id="rail" aria-label="Main"></nav>
    <main class="main" id="main" tabindex="-1">
      <div class="empty" style="padding:80px 20px">Loading EnergyMap…</div>
    </main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript><div style="padding:40px;font-family:sans-serif">EnergyMap needs JavaScript to run.</div></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
